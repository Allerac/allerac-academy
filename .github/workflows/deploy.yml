# Deploys app/ to Cloudflare (Worker allerac-academy, academy.allerac.ai) on every push to main.
#
# This is the deploy route for this repo (Cloudflare Workers Builds is not used).
# The job runs in the GitHub environment "production", which holds these secrets:
#   CLOUDFLARE_API_TOKEN   token that can deploy the allerac-academy Worker and
#                          apply D1 migrations (Workers Scripts Edit, D1 Edit)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "content/**", "tutor/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://academy.allerac.ai
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: d1 migrations apply academy --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy
